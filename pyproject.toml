[project]
name = "zenitcheck"
version = "1.0.0"
description = "Aplicación de inspección de equipos de trabajo en alturas con visión artificial"
requires-python = ">=3.13"

# ============================================
# pytest
# ============================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "zenitcheck.settings.test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Pruebas unitarias sin acceso a BD",
    "slow: Pruebas que tardan más de 2s (IA, PDF)",
    "e2e: Pruebas end-to-end de vistas completas",
]
testpaths = ["tests"]

# ============================================
# coverage
# ============================================
[tool.coverage.run]
source = ["equipment", "accounts", "inspections", "reports", "ai_engine", "sync"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "zenitcheck/settings/*",
    "scripts/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]
